# AndroidX is required by androidbrowserhelper.
android.useAndroidX=true
org.gradle.jvmargs=-Xmx1536m

# --- Release signing -------------------------------------------------------
# The keystore is NOT in this repository. Put the real passwords in your
# user-level ~/.gradle/gradle.properties (it overrides this file) and keep
# the keystore file + passwords safe — a Play-Store listing is bound to
# this signature forever, and assetlinks.json (full-screen TWA) is bound to
# its SHA-256 fingerprint.
# Path is resolved from the :app module dir.
MEDIDOOR_STORE_FILE=../keystore/medidoor-pharmacy.keystore
MEDIDOOR_STORE_PASSWORD=CHANGE_ME
MEDIDOOR_KEY_ALIAS=medidoor-pharmacy
MEDIDOOR_KEY_PASSWORD=CHANGE_ME
