<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MediDoor · Admin Console</title>
<link rel="icon" type="image/png" href="/admin/admin-icon.png" />
<link rel="apple-touch-icon" href="/admin/admin-icon.png" />
<style>
  :root{
    --bg:#0b1220; --panel:#121b2e; --panel2:#172339; --line:#243149;
    --txt:#e7eefc; --muted:#9fb0cc; --brand:#06ad65; --brand2:#0bd17f;
    --danger:#ff5a5f; --warn:#ffb020; --ok:#22c55e; --chip:#1d2a44;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,#13325a33,transparent),var(--bg);
    color:var(--txt);font:14px/1.5 "Segoe UI",system-ui,Arial,"Noto Sans Bengali",sans-serif;}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;color:#fff;background:var(--panel2);
    border:1px solid var(--line);transition:.15s;}
  button:hover{border-color:var(--brand);transform:translateY(-1px)}
  button.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));border:0;font-weight:600}
  button.danger{background:#3a1620;border-color:#5b2330;color:#ffd9dc}
  button.warn{background:#3a2c12;border-color:#5b481f;color:#ffe6b3}
  button.ghost{background:transparent}
  button.sm{padding:5px 10px;border-radius:8px;font-size:12px}
  input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:9px 11px;font:inherit;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--brand)}
  textarea{resize:vertical;min-height:80px;font-family:inherit}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
  a{color:var(--brand2)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grow{flex:1}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
  .muted{color:var(--muted)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--chip);border:1px solid var(--line)}
  .pill.ok{background:#0f2c1c;border-color:#1d5638;color:#7ef0b0}
  .pill.bad{background:#33151a;border-color:#5b2330;color:#ff9aa0}
  .pill.warn{background:#332813;border-color:#5b481f;color:#ffd58a}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
  th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel);z-index:1}
  tbody tr:hover{background:#16223a}
  tbody tr.sel{background:#143a2a}
  .tablewrap{max-height:calc(100vh - 320px);overflow:auto;border:1px solid var(--line);border-radius:12px}
  #app{display:none;min-height:100vh}
  .top{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);
    background:#0d1626cc;position:sticky;top:0;z-index:20;backdrop-filter:blur(6px)}
  .logo{font-weight:800;letter-spacing:.3px}
  .logo b{color:var(--brand2)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line);background:#0c1422}
  .tab{padding:8px 14px;border-radius:10px;border:1px solid transparent;color:var(--muted);background:transparent}
  .tab.active{background:var(--panel2);border-color:var(--line);color:var(--txt)}
  .wrap{padding:18px;max-width:1500px;margin:0 auto}
  .sub-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .sub-tab{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px}
  .sub-tab.active{background:var(--brand);border-color:var(--brand);color:#042}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px}
  .stat .n{font-size:26px;font-weight:800}
  .stat .l{color:var(--muted);font-size:12px}
  #login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  #login .card{width:380px;max-width:100%}
  .brandhead{font-size:22px;font-weight:800;margin-bottom:2px}
  .brandhead b{color:var(--brand2)}
  .field{margin-bottom:12px}
  .err{background:#33151a;border:1px solid #5b2330;color:#ffb3b8;padding:10px 12px;border-radius:10px;white-space:pre-wrap;font-size:12.5px;margin-top:8px}
  .modal-bg{position:fixed;inset:0;background:#04070dcc;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:920px;width:100%;
    max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
  .modal h3{margin:0;padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal .body{padding:18px}
  .kv{display:grid;grid-template-columns:180px 1fr;gap:4px 12px;font-size:13px}
  .kv .k{color:var(--muted)}
  .kv .v{word-break:break-word;white-space:pre-wrap}
  pre{background:#0a0f1a;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:12px;max-height:340px}
  .toast{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:8px}
  .toast div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;box-shadow:var(--shadow);min-width:220px;animation:sl .2s}
  .toast div.ok{border-color:#1d5638}.toast div.bad{border-color:#5b2330}
  @keyframes sl{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .thread{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto;padding:6px}
  .msg{max-width:78%;padding:8px 12px;border-radius:12px;font-size:13px}
  .msg.in{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
  .msg.out{align-self:flex-end;background:#143a2a;border:1px solid #1d5638}
  .msg .t{font-size:10px;color:var(--muted);margin-top:3px}
  .feat{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--panel2)}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brand2);border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}
  @keyframes r{to{transform:rotate(360deg)}}
  .small{font-size:12px}
  .badgebig{font-size:15px;font-weight:800;padding:6px 16px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:.4}}
  .dropzone{border:2px dashed var(--line);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:.15s;background:var(--panel)}
  .dropzone:hover{border-color:var(--brand)}
  .dropzone.drag{border-color:var(--brand2);background:#0f2c1c}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login">
  <div class="card">
    <div style="text-align:center;margin-bottom:10px"><img src="/admin/admin-icon.png" alt="MediDoor Admin" style="width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid var(--line);box-shadow:var(--shadow)"></div>
    <div class="brandhead" style="text-align:center">Medi<b>Door</b> · Admin</div>
    <div class="muted small" style="margin-bottom:16px;text-align:center">Password দিয়ে login করুন।</div>
    <div class="field">
      <label>Password</label>
      <input id="lg-pw" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()" autofocus />
    </div>
    <label class="row small" style="margin-bottom:12px"><input type="checkbox" id="lg-remember" style="width:auto;margin-right:8px"> এই browser-এ মনে রাখো</label>
    <button class="primary" style="width:100%" id="lg-btn" onclick="doLogin()">Login</button>
    <div id="lg-err" class="err" style="display:none"></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <div class="top">
    <div class="logo">Medi<b>Door</b> Admin Console</div>
    <div class="muted small" id="who"></div>
    <div class="grow"></div>
    <button class="sm ghost" onclick="reloadActive()">🔄 Refresh</button>
    <button class="sm danger" onclick="logout()">Logout</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="wrap" id="view"></div>
</div>

<div class="modal-bg" id="modalbg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<!-- Stacked in-app confirm/prompt dialog (replaces native confirm()/prompt()
     so it renders in-theme AND does not block browser automation). Higher
     z-index than #modalbg so it sits on top of an open detail modal. -->
<div class="modal-bg" id="uidlgbg" style="z-index:60" onclick="if(event.target===this)_uiDlgClose(_uiDlgCancel)">
  <div class="modal" id="uidlg" style="max-width:460px"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* MediDoor Admin Console — password-gated, same-origin SPA. */
const STATE = { pw: "", token: null, tab: "content" };

/* ---------- auth ---------- */
async function login() {
  const r = await fetch("/api/admin/console/login", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: STATE.pw }),
  });
  if (!r.ok) {
    const d = await safeDetail(r);
    if (r.status === 401) throw new Error("ভুল password।");
    throw new Error("Login failed: HTTP " + r.status + (d ? "\n" + d : ""));
  }
  const j = await r.json();
  STATE.token = j.access_token;
  if (!STATE.token) throw new Error("Login returned no token.");
}
async function safeDetail(r) {
  try { const t = await r.text(); try { const j = JSON.parse(t); return typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail || j); } catch { return t.slice(0, 600); } } catch { return ""; }
}
async function api(path, { method = "GET", body = null } = {}) {
  for (let attempt = 1; attempt <= 2; attempt++) {
    if (!STATE.token) await login();
    const headers = { "Authorization": "Bearer " + STATE.token };
    if (body !== null) headers["Content-Type"] = "application/json";
    const r = await fetch(path, { method, headers, body: body !== null ? JSON.stringify(body) : null });
    if (r.status === 401 && attempt === 1) { STATE.token = null; continue; }
    if (!r.ok) {
      const detail = await safeDetail(r);
      if (r.status === 500)
        throw new Error("HTTP 500 — backend exception।\n\n" + detail +
          "\n\nসম্ভাব্য কারণ: production DB-তে missing column (ban/block migration চালানো হয়নি)।");
      throw new Error("HTTP " + r.status + (detail ? " — " + detail : ""));
    }
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  }
}

/* ---------- ui helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => (s == null ? "" : String(s)).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function toast(msg, kind = "ok") { const d = document.createElement("div"); d.className = kind; d.textContent = msg; $("#toast").appendChild(d); setTimeout(() => d.remove(), 3600); }
function modal(html) { $("#modal").innerHTML = html; $("#modalbg").style.display = "flex"; }
function closeModal() { $("#modalbg").style.display = "none"; $("#modal").innerHTML = ""; }

/* ---------- in-app confirm / prompt (replace native confirm()/prompt()) ----------
   Native confirm()/prompt() dialogs freeze the page and are invisible to
   browser automation (Problem 12 — admin rider "Verify" could not proceed).
   These async helpers render a themed dialog stacked above the detail modal
   and resolve a Promise, so callers just `await uiConfirm(...)`/`uiPrompt(...)`. */
let _uiDlgResolve = null, _uiDlgCancel = false;
function _uiDlgClose(val) {
  const r = _uiDlgResolve; _uiDlgResolve = null;
  $("#uidlgbg").style.display = "none"; $("#uidlg").innerHTML = "";
  document.removeEventListener("keydown", _uiDlgKey, true);
  if (r) r(val);
}
function _uiDlgKey(e) {
  if (e.key === "Escape") { e.preventDefault(); _uiDlgClose(_uiDlgCancel); return; }
  if (e.key !== "Enter" || !$("#uidlgok")) return;
  const inTextarea = document.activeElement && document.activeElement.tagName === "TEXTAREA";
  // In the prompt textarea, plain Enter inserts a newline; submit on Ctrl/⌘+Enter.
  // In a confirm dialog (no textarea), plain Enter confirms.
  if (inTextarea && !(e.ctrlKey || e.metaKey)) return;
  e.preventDefault(); $("#uidlgok").click();
}
function uiConfirm(message, opts = {}) {
  _uiDlgCancel = false;
  const okText = opts.okText || "Confirm";
  const danger = opts.danger !== false; // confirms are destructive by default
  return new Promise(res => {
    _uiDlgResolve = res;
    $("#uidlg").innerHTML = `<h3><span>${esc(opts.title || "নিশ্চিত করুন")}</span><button class="sm ghost" onclick="_uiDlgClose(false)">✕</button></h3>
      <div class="body"><div style="font-size:14px;white-space:pre-wrap;line-height:1.5;margin-bottom:18px">${esc(message)}</div>
      <div class="row" style="justify-content:flex-end;gap:8px"><button class="sm ghost" onclick="_uiDlgClose(false)">বাতিল</button>
      <button id="uidlgok" class="${danger ? "danger" : "primary"}" onclick="_uiDlgClose(true)">${esc(okText)}</button></div></div>`;
    $("#uidlgbg").style.display = "flex";
    document.addEventListener("keydown", _uiDlgKey, true);
    setTimeout(() => { const b = $("#uidlgok"); if (b) b.focus(); }, 30);
  });
}
function uiPrompt(message, opts = {}) {
  _uiDlgCancel = null;
  const def = opts.defaultValue || "";
  const required = !!opts.required;
  const okText = opts.okText || "OK";
  return new Promise(res => {
    _uiDlgResolve = res;
    $("#uidlg").innerHTML = `<h3><span>${esc(opts.title || "লিখুন")}</span><button class="sm ghost" onclick="_uiDlgClose(null)">✕</button></h3>
      <div class="body"><div style="font-size:14px;white-space:pre-wrap;line-height:1.5;margin-bottom:10px">${esc(message)}</div>
      <textarea id="uidlgin" style="min-height:70px;width:100%">${esc(def)}</textarea>
      <div id="uidlgerr" class="small" style="color:#ffb3b8;min-height:16px;margin-top:4px"></div>
      <div class="row" style="justify-content:flex-end;gap:8px"><button class="sm ghost" onclick="_uiDlgClose(null)">বাতিল</button>
      <button id="uidlgok" class="primary" onclick="_uiPromptOk(${required})">${esc(okText)}</button></div></div>`;
    $("#uidlgbg").style.display = "flex";
    document.addEventListener("keydown", _uiDlgKey, true);
    setTimeout(() => { const el = $("#uidlgin"); if (el) { el.focus(); el.select(); } }, 30);
  });
}
function _uiPromptOk(required) {
  const el = $("#uidlgin"); const val = el ? el.value.trim() : "";
  if (required && !val) { const er = $("#uidlgerr"); if (er) er.textContent = "⚠ এই ঘরটি পূরণ করতে হবে।"; return; }
  _uiDlgClose(val);
}
function spinner() { $("#view").innerHTML = '<div class="card"><span class="spin"></span> লোড হচ্ছে…</div>'; }
function errCard(e) { return `<div class="card"><div class="err" style="display:block">⚠ ${esc(e.message || e)}</div></div>`; }
function fullUrl(u) { if (!u) return u; return /^https?:/.test(u) ? u : u; }

/* ---------- tabs ---------- */
const TABS = [["content","📝 Login Content"],["users","👥 Users"],["medai","🤖 Medi AI"],["site","🌐 Site"],["orders","📦 Orders"],["moderation","🛡 Moderation"],["products","🧪 Products"],["audit","🧾 Audit log"]];
function renderTabs() { $("#tabs").innerHTML = TABS.map(([k, l]) => `<button class="tab ${STATE.tab === k ? "active" : ""}" onclick="go('${k}')">${l}</button>`).join(""); }
function go(tab) { STATE.tab = tab; renderTabs(); render(); }
function reloadActive() { render(); }
const RENDERERS = { content: renderLoginContent, users: renderUsersSection, medai: renderMediAI, site: renderSite, orders: renderOrders, moderation: renderModeration, products: renderProducts, audit: renderAuditLog };
function render() { (RENDERERS[STATE.tab] || (() => {}))(); }

/* ============================================================ USERS (group) */
let USERS_SUB = "customers";
function renderUsersSection() {
  const sub = (k, l) => `<button class="sub-tab ${USERS_SUB === k ? "active" : ""}" onclick="USERS_SUB='${k}';renderUsersSection()">${l}</button>`;
  $("#view").innerHTML = `<div class="sub-tabs">${sub("customers", "👤 Customers")}${sub("pharmacies", "🏪 Pharmacies")}${sub("riders", "🚴 Riders")}</div><div id="users-body"><div class="card"><span class="spin"></span> লোড হচ্ছে…</div></div>`;
  if (USERS_SUB === "riders") renderRiders(); else renderUsers(USERS_SUB);
}
function uview(html) { (document.getElementById("users-body") || document.getElementById("view")).innerHTML = html; }
function uspin() { uview('<div class="card"><span class="spin"></span> লোড হচ্ছে…</div>'); }

/* ============================================================ CONTENT */
const SECTIONS = [["default","Default (no role)"],["customer","Customer"],["pharmacy","Pharmacy"],["rider","Rider"]];
const ICONS = ["MapPin","ShieldCheck","Sparkles","Truck","Pill","Wallet","Store","ClipboardList","TrendingUp","Bike"];
const SCALARS = [["eyebrow","Eyebrow"],["title_top","Title — line 1"],["title_highlight","Title — line 2 (highlight)"],["body","Body"],["stat_value","Stat value"],["stat_label","Stat label"]];
/* Medi AI ও Site এখন আলাদা top-level tab; Content tab শুধু Login page content দেখায়। */
let LOGIN_ROLE = "default", LOGIN_DATA = null;
async function renderLoginContent() {
  try {
    if (!LOGIN_DATA) { $("#view").innerHTML = '<div class="card"><span class="spin"></span> লোড হচ্ছে…</div>'; LOGIN_DATA = await api("/api/content/login"); }
  } catch (e) { $("#view").innerHTML = errCard(e); return; }
  const s = LOGIN_DATA[LOGIN_ROLE] || {};
  const label = (SECTIONS.find(x => x[0] === LOGIN_ROLE) || [LOGIN_ROLE, LOGIN_ROLE])[1];
  const roleBtns = SECTIONS.map(([key, lb]) => `<button class="sub-tab ${LOGIN_ROLE === key ? "active" : ""}" onclick="switchLoginRole('${key}')">${lb}</button>`).join("");
  $("#view").innerHTML = `
    <div class="sub-tabs">${roleBtns}</div>
    <div class="muted small" style="margin:-6px 0 12px">login page-এর বাম পাশের role-অনুযায়ী text। উপরে role বেছে edit করুন, তারপর Save।</div>
    <div class="card" id="login-editor">
      <div class="row"><h3 style="margin:0">${esc(label)}</h3><span class="pill">${LOGIN_ROLE}</span><div class="grow"></div>
        <button class="sm ghost" onclick="reloadLoginContent()">↻ Reload from server</button>
        <button class="primary sm" onclick="saveLoginSection()">💾 Save ${LOGIN_ROLE}</button></div>
      <div class="grid2" style="margin-top:12px">
        ${SCALARS.map(([k, lb]) => `<div><label>${lb}</label>${k === "body" ? `<textarea data-f="${k}" style="min-height:90px">${esc(s[k] || "")}</textarea>` : `<input data-f="${k}" value="${esc(s[k] || "")}">`}</div>`).join("")}
      </div>
      <div class="row" style="margin:14px 0 6px"><b>Features</b><button class="sm" onclick="addLoginFeat()">+ Add feature</button></div>
      <div id="login-feats">${(s.features || []).map(featHtml).join("")}</div>
    </div>`;
}
function captureLoginForm() {
  if (!LOGIN_DATA) return;
  const ed = document.getElementById("login-editor");
  if (!ed) return;
  const sec = {};
  ed.querySelectorAll("[data-f]").forEach(el => sec[el.dataset.f] = el.value);
  sec.features = [...ed.querySelectorAll("#login-feats .feat")].map(fr => {
    const o = {}; fr.querySelectorAll("[data-ff]").forEach(el => o[el.dataset.ff] = el.value); return o;
  });
  LOGIN_DATA[LOGIN_ROLE] = sec;
}
function switchLoginRole(role) { captureLoginForm(); LOGIN_ROLE = role; renderLoginContent(); }
function reloadLoginContent() { LOGIN_DATA = null; renderLoginContent(); }
function featHtml(f) { f = f || {}; return `<div class="feat row">
    <div style="width:160px"><label>Icon</label><select data-ff="icon">${ICONS.map(i => `<option ${i === f.icon ? "selected" : ""}>${i}</option>`).join("")}</select></div>
    <div class="grow"><label>Title</label><input data-ff="title" value="${esc(f.title || "")}"></div>
    <div class="grow"><label>Body</label><input data-ff="body" value="${esc(f.body || "")}"></div>
    <button class="danger sm" style="align-self:flex-end" onclick="this.closest('.feat').remove()">✕</button></div>`; }
function addLoginFeat() { document.getElementById("login-feats").insertAdjacentHTML("beforeend", featHtml({ icon: "Sparkles" })); }
async function saveLoginSection() {
  captureLoginForm();
  const sec = LOGIN_DATA[LOGIN_ROLE] || {};
  const payload = {};
  for (const [k] of SCALARS) payload[k] = (sec[k] || "").trim();
  payload.features = (sec.features || []).map(f => ({ icon: (f.icon || "Sparkles").trim(), title: (f.title || "").trim(), body: (f.body || "").trim() }));
  for (const [k, lb] of SCALARS) if (!payload[k]) return toast(`'${lb}' খালি রাখা যাবে না (${LOGIN_ROLE})`, "bad");
  if (!payload.features.length) return toast("কমপক্ষে একটি feature দরকার", "bad");
  for (const f of payload.features) if (!f.icon || !f.title || !f.body) return toast("Feature-এর সব ঘর পূরণ করুন", "bad");
  try { await api(`/api/content/login/${LOGIN_ROLE}`, { method: "PUT", body: payload }); LOGIN_DATA[LOGIN_ROLE] = payload; toast(`✅ ${LOGIN_ROLE} saved`); }
  catch (e) { toast(e.message, "bad"); }
}
/* ============================================================ MEDI AI */
async function renderMediAI() {

function aiKnowRow(val) { return `<div class="row know-row" style="margin-bottom:6px"><textarea class="ai-k" style="min-height:46px">${esc(val || "")}</textarea><button class="danger sm" style="align-self:flex-start" onclick="this.closest('.know-row').remove()">✕</button></div>`; }

async function saveAI() {
  const knowledge = [...document.querySelectorAll("#ai-know .ai-k")].map(t => t.value.trim()).filter(Boolean);

function ensureDoc(slug, title) {
  let idx = DOCS_DATA.findIndex(d => d.slug === slug);
  if (idx === -1) { DOCS_DATA.push({ slug, title: title || slug, subtitle: "", updated: "", visible: true, order: DOCS_DATA.length + 1, blocks: [] }); idx = DOCS_DATA.length - 1; }
  return idx;
}
// Normalise a page slug: strip any pasted scheme+host, a leading /p/, and
// slashes, so a link like "https://medidoor.com.bd/about" or "/about" always
// becomes the clean slug "about" (the website looks pages up by this slug).
function slugify(raw) {
  return (raw || "").trim().toLowerCase()
    .replace(/^https?:\/\/[^/]+/, "")
    .replace(/^\/?(p\/)?/, "")
    .replace(/[^a-z0-9ঀ-৿]+/g, "-")
    .replace(/^-+|-+$/g, "");
}

function captureSite() {

  const set = (obj, id, key) => { const val = v(id); if (val !== undefined) obj[key] = val; };

  set(SITE_DATA.bot, "st-bot-name", "name"); set(SITE_DATA.bot, "st-bot-tag", "tagline"); set(SITE_DATA.bot, "st-bot-av", "avatar_url");
  set(SITE_DATA.admin_support, "st-sup-name", "name"); set(SITE_DATA.admin_support, "st-sup-tag", "tagline"); set(SITE_DATA.admin_support, "st-sup-av", "avatar_url");
  SITE_DATA.favicon = SITE_DATA.favicon || {}; set(SITE_DATA.favicon, "st-fav-img", "image_url");
  if (v("st-pn") !== undefined) SITE_DATA.pharmacy_notice = v("st-pn");
  const fa = v("st-ft-about"), fc = v("st-ft-copy");
  if (fa !== undefined) SITE_DATA.footer.about = fa;
  if (fc !== undefined) SITE_DATA.footer.copyright = fc;
  if (document.getElementById("footer-cols")) {
    SITE_DATA.footer.columns = [...document.querySelectorAll("#footer-cols .fcol")].map(col => ({
      title: col.querySelector(".fcol-title").value,
      links: [...col.querySelectorAll(".flink")].map(r => ({ label: r.querySelector(".flink-label").value, href: r.querySelector(".flink-href").value })),

  if (document.getElementById("footer-socials")) {
    SITE_DATA.footer.socials = [...document.querySelectorAll("#footer-socials .fsoc")].map(s => ({ label: s.querySelector(".fsoc-label").value, href: s.querySelector(".fsoc-href").value }));
  }
}

/* ---- drag & drop image upload + client-side resize ---- */
function imgPreviewTag(u, round) { return `<img src="${u}" onerror="imgErr(this)" style="${round ? "width:72px;height:72px;border-radius:50%" : "max-width:100%;max-height:180px;border-radius:10px"};border:1px solid var(--line);object-fit:cover">`; }
function imgPreview(id, round) { const el = document.getElementById(id + "-prev"); if (!el) return; const v = document.getElementById(id).value; el.innerHTML = v ? imgPreviewTag(esc(fullUrl(v)), round) : ""; }
function imgUploadField(id, label, val, maxDim, round) {
  return `<div>
    <label>${label}</label>
    <div class="dropzone" id="${id}-dz" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="imgDrop(event,'${id}',${maxDim})" onclick="document.getElementById('${id}-file').click()">
      <div class="muted small">📂 ছবি drag করুন বা click করে select করুন<br>(auto-resize → max ${maxDim}px)</div>
    </div>
    <input type="file" accept="image/png,image/jpeg,image/webp" id="${id}-file" style="display:none" onchange="if(this.files[0])uploadImage(this.files[0],'${id}',${maxDim})">
    <input id="${id}" value="${esc(val || "")}" placeholder="https://… (অথবা উপরে upload)" oninput="captureSite();imgPreview('${id}',${round ? 1 : 0})" style="margin-top:6px">
    <div id="${id}-prev" style="margin-top:6px">${val ? imgPreviewTag(esc(fullUrl(val)), round) : ""}</div>
  </div>`;
}
function imgDrop(ev, id, maxDim) { ev.preventDefault(); const dz = document.getElementById(id + "-dz"); dz.classList.remove("drag"); const f = ev.dataTransfer.files && ev.dataTransfer.files[0]; if (f) uploadImage(f, id, maxDim); }
function resizeImage(file, maxDim) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.width, h = img.height; const scale = Math.min(1, maxDim / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      const type = file.type === "image/png" ? "image/png" : "image/jpeg";
      c.toBlob(b => b ? resolve(b) : reject(new Error("resize failed")), type, 0.9);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image read failed")); };
    img.src = url;
  });
}
async function uploadImage(file, id, maxDim) {
  const dz = document.getElementById(id + "-dz"); const round = id.endsWith("-av");
  dz.innerHTML = '<span class="spin"></span> resize + upload হচ্ছে…';
  try {
    const blob = await resizeImage(file, maxDim);
    const fd = new FormData(); fd.append("file", blob, "image." + (blob.type === "image/png" ? "png" : "jpg")); fd.append("kind", "banner");
    const r = await fetch("/api/upload", { method: "POST", body: fd });
    if (!r.ok) throw new Error("upload failed HTTP " + r.status);
    let url = (await r.json()).url || "";
    if (location.host.endsWith("medidoor.com.bd")) url = url.replace(/^https?:\/\/[^/]+/, "https://api.medidoor.com.bd");
    document.getElementById(id).value = url; captureSite(); imgPreview(id, round ? 1 : 0);
    dz.innerHTML = '<div class="muted small">✅ uploaded — আবার drag করলে replace হবে</div>';

}
function addBlock(type) {
  captureDocEditor(); const doc = DOCS_DATA[DOC_IDX]; doc.blocks = doc.blocks || [];
  const nb = type === "divider" ? { type } : type === "image" ? { type, url: "", width: 100, align: "center", caption: "" }
    : { type, text: "", font: "", size: type === "heading" ? 24 : 16, color: type === "heading" ? "#06ad65" : "", align: "left", bold: type === "heading" };
  doc.blocks.push(nb); renderSite();
}
function moveBlock(bi, dir) { captureDocEditor(); const b = DOCS_DATA[DOC_IDX].blocks; const j = bi + dir; if (j < 0 || j >= b.length) return; const t = b[bi]; b[bi] = b[j]; b[j] = t; renderSite(); }
function removeBlock(bi) { captureDocEditor(); DOCS_DATA[DOC_IDX].blocks.splice(bi, 1); renderSite(); }
function dq(el, sel) { const x = el.querySelector(sel); return x ? x.value : ""; }
function captureDocEditor() {

function imgDropDoc(ev, bi) { ev.preventDefault(); const dz = document.getElementById(`dbimg-${bi}-dz`); dz.classList.remove("drag"); const f = ev.dataTransfer.files && ev.dataTransfer.files[0]; if (f) uploadDocImage(f, bi); }

function docBlockPreview(b) {

/* ============================================================ USERS */
const USERS_CACHE = {};
async function renderUsers(group) {
  uspin();
  try {
    const rows = await api(`/api/admin/users/${group}?limit=2000`); USERS_CACHE[group] = {};
    const isCust = group === "customers";
    const cols = isCust
      ? [["gmail","Gmail"],["name","Name"],["phone_number","Phone"],["status","Status"],["is_registered","Reg"],["created_at","Created"]]
      : [["gmail","Gmail"],["pharmacy_name","Pharmacy"],["pharmacy_license_no","License #"],["verification_status","DGDA"],["status","Status"],["is_registered","Reg"],["created_at","Created"]];
    const body = rows.map(r => {
      const id = r.account_id || r.id; USERS_CACHE[group][id] = r;
      const banned = isCust ? r.is_banned : r.is_blocked;
      const name = isCust ? `${r.first_name || ""} ${r.last_name || ""}`.trim() || "—" : (r.pharmacy_name || "—");
      const statusPill = banned ? `<span class="pill bad">${isCust ? "banned" : "blocked"}</span>`
        : (r.has_profile === false ? `<span class="pill warn">incomplete</span>`
        : (!isCust && r.is_published ? `<span class="pill ok">public</span>` : `<span class="pill">active</span>`));
      const cells = cols.map(([k]) => {
        if (k === "name") return `<td>${esc(name)}</td>`;
        if (k === "status") return `<td>${statusPill}</td>`;
        if (k === "is_registered") return `<td>${r.is_registered ? "✓" : "✗"}</td>`;
        if (k === "created_at") return `<td class="small muted">${esc((r.created_at || "").slice(0, 19))}</td>`;
        if (k === "verification_status") { const v = r.verification_status || "—"; const cl = v === "verified" ? "ok" : (["expired","mismatch","not_found"].includes(v) ? "bad" : "warn"); return `<td><span class="pill ${cl}">${esc(v)}</span></td>`; }
        return `<td>${esc(r[k] || "—")}</td>`;
      }).join("");
      return `<tr onclick="userDetail('${group}','${id}')" style="cursor:pointer">${cells}</tr>`;
    }).join("");
    const regCount = rows.filter(x => x.is_registered).length;
    $("#users-body").innerHTML = `<div class="card">

  } catch (e) { uview(errCard(e)); }
}
/* ---- rich detail helpers (shared by customers / pharmacies / riders) ---- */
function fmtVal(v) { return esc(v == null || v === "" ? "—" : (typeof v === "object" ? JSON.stringify(v) : v)); }
function imgErr(el) { el.replaceWith(Object.assign(document.createElement("div"), { className: "muted small", textContent: "image load failed" })); }
function imgThumb(url, label) { const u = esc(fullUrl(url)); return `<div style="text-align:center;margin-bottom:10px"><a href="${u}" target="_blank"><img src="${u}" referrerpolicy="no-referrer" onerror="imgErr(this)" style="max-width:200px;max-height:170px;border-radius:10px;border:1px solid var(--line);object-fit:cover"></a><div class="muted small">${esc(label)}</div></div>`; }
function kvCard(title, entries) { return `<div class="card" style="margin-bottom:10px"><b>${esc(title)}</b><div class="kv" style="margin-top:8px">${entries.map(([k, v]) => `<div class="k">${esc(k)}</div><div class="v">${v}</div>`).join("")}</div></div>`; }
function acctCard(r, roleLabel) { return kvCard("Account (login info)", [["id", fmtVal(r.account_id || r.id)], ["gmail", fmtVal(r.gmail)], ["role", roleLabel], ["is_active", r.is_active ? "✓ true" : "✗ false"], ["is_registered", r.is_registered ? "✓ yes" : "✗ no"], ["has_profile", r.has_profile === false ? "✗ no" : "✓ yes"], ["created_at", fmtVal((r.created_at || "").slice(0, 19))]]); }
function profileCard(r, title) { const skip = new Set(["account_id", "id", "gmail", "google_sub", "role", "is_active", "is_registered", "has_profile", "created_at", "updated_at"]); const entries = Object.entries(r).filter(([k]) => !skip.has(k) && !/_url$/.test(k)).map(([k, v]) => [k, fmtVal(v)]); return entries.length ? kvCard(title, entries) : ""; }
function badgeBig(text) { return `<div style="text-align:center;margin-top:12px"><span class="pill bad badgebig">${text}</span></div>`; }
function detailLayout(left, right) { return `<div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:300px">${left}</div><div style="width:230px;min-width:200px"><div class="card"><b>Media & status</b><div style="margin-top:10px">${right}</div></div></div></div>`; }

function userDetail(group, id) {
  const r = USERS_CACHE[group][id]; const isCust = group === "customers"; const banned = isCust ? r.is_banned : r.is_blocked;
  const left = acctCard(r, group.slice(0, -1)) + profileCard(r, isCust ? "Customer profile" : "Pharmacy profile");

async function userAction(group, id, action) {

}
async function modDismiss(mid, btn) { try { await api(`/api/admin/moderation/messages/${mid}/dismiss`, { method: "POST" }); toast("✅ flag dismissed"); if (btn) btn.outerHTML = '<span class="muted small">✓ reviewed</span>'; } catch (e) { toast(e.message, "bad"); } }
async function modUnblock(id) { const note = await uiPrompt("Unblock note (optional, participants দেখবে):", { title: "Unblock conversation", okText: "Unblock" }); if (note == null) return; try { await api(`/api/admin/moderation/conversations/${id}/unblock`, { method: "POST", body: { note: note.trim() || null } }); toast("✅ unblocked"); closeModal(); renderModeration(); } catch (e) { toast(e.message, "bad"); } }

async function renderModProducts() {
  const q = MOD_PROD_FILTER && MOD_PROD_FILTER !== "queue" ? `?status_filter=${MOD_PROD_FILTER}` : "";
  const rows = await api(`/api/admin/moderation/products${q}`);
  rows.forEach(m => MOD_PROD_CACHE[m.id] = m);
  const filt = [["queue", "⏳ Queue"], ["pending", "Pending"], ["rejected", "Rejected"], ["approved", "Approved"], ["all", "All"]]
    .map(([v, l]) => `<button class="sub-tab ${MOD_PROD_FILTER === v ? "active" : ""}" onclick="MOD_PROD_FILTER='${v}';renderProducts()">${l}</button>`).join("");
  const body = rows.map(m => {
    const st = m.approval_status || "approved"; const cls = st === "rejected" ? "bad" : st === "pending" ? "warn" : "ok";
    return `<tr onclick="modViewProduct('${m.id}')" style="cursor:pointer">
      <td><span class="pill ${cls}">${esc(st)}</span></td><td>${esc((m.pharmacy || {}).name || "—")}</td><td>${esc(m.name || "—")}</td>
      <td>${esc(m.category || "—")}</td><td>${esc(m.approval_category || "—")}</td><td>৳${esc(m.price ?? "")}</td><td>${m.prescription_required ? "📋" : ""}</td>
      <td title="${esc(m.approval_reason || "")}">${esc((m.approval_reason || "").slice(0, 70))}</td>
      <td><button class="primary sm" onclick="event.stopPropagation();modProduct('${m.id}','approve')">✅</button> <button class="danger sm" onclick="event.stopPropagation();modProduct('${m.id}','reject')">⛔</button></td></tr>`;
  }).join("");
  $("#mod-body").innerHTML = `<div class="sub-tabs">${filt}</div>
    <div class="card"><div class="row"><h3 style="margin:0">Product moderation</h3><span class="pill">${rows.length}</span>
      <input placeholder="🔍 search…" style="max-width:220px" oninput="filterTable('modptable',this.value)"><div class="grow"></div><button class="sm" onclick="renderProducts()">🔄</button></div>
    <div class="tablewrap" style="margin-top:12px"><table id="modptable"><thead><tr><th>Status</th><th>Pharmacy</th><th>Product</th><th>Pharm cat</th><th>AI cat</th><th>Price</th><th>Rx</th><th>AI reason</th><th>Actions</th></tr></thead>
    <tbody>${body || `<tr><td colspan="9" class="muted">কোনো product নেই।</td></tr>`}</tbody></table></div>
    <div class="muted small" style="margin-top:8px">row-এ click → product details + image।</div></div>`;
}
function modViewProduct(id) {
  const m = MOD_PROD_CACHE[id]; const ph = m.pharmacy || {};
  const st = m.approval_status || "approved"; const cls = st === "rejected" ? "bad" : st === "pending" ? "warn" : "ok";
  modal(`<h3><span>🧪 ${esc(m.name || "—")} <span class="pill ${cls}">${esc(st)}</span></span><button class="sm ghost" onclick="closeModal()">✕</button></h3>
    <div class="body"><div class="row" style="margin-bottom:12px"><button class="primary" onclick="modProduct('${id}','approve')">✅ Approve</button><button class="danger" onclick="modProduct('${id}','reject')">⛔ Reject</button></div>
    <div style="display:flex;gap:14px;flex-wrap:wrap"><div style="flex:1;min-width:280px"><div class="kv">
        <div class="k">Pharmacy</div><div class="v">${esc(ph.name || "—")}${ph.phone_number ? " · " + esc(ph.phone_number) : ""}</div>
        <div class="k">Pharmacy category</div><div class="v">${esc(m.category || "—")}</div>
        <div class="k">Price · Stock</div><div class="v">৳${esc(m.price ?? "")} · ${esc(m.stock ?? "")}</div>
        <div class="k">Prescription</div><div class="v">${m.prescription_required ? "YES 📋" : "no"}</div>
        <div class="k">AI status</div><div class="v">${esc(st)}</div>
        <div class="k">AI category</div><div class="v">${esc(m.approval_category || "—")}</div>
        <div class="k">AI reason</div><div class="v">${esc(m.approval_reason || "—")}</div>
        <div class="k">Reviewed by admin</div><div class="v">${m.approval_reviewed_by_admin ? "yes" : "no"}</div>
        <div class="k">Short desc</div><div class="v">${esc(m.short_description || "—")}</div>
        <div class="k">Description</div><div class="v">${esc(m.description || "—")}</div>
      </div></div>
      <div style="width:220px">${m.image_url ? `<a href="${esc(fullUrl(m.image_url))}" target="_blank"><img src="${esc(fullUrl(m.image_url))}" onerror="imgErr(this)" style="max-width:200px;border-radius:10px;border:1px solid var(--line)"></a>` : '<div class="muted small">No image</div>'}</div>
    </div></div>`);
}
async function modProduct(id, action) {
  let body = {};
  if (action === "reject") { const reason = await uiPrompt("Reject reason (pharmacy দেখবে):", { title: "⛔ Reject product", required: true, okText: "Reject" }); if (reason == null) return; body = { note: reason.trim() }; }
  else { const note = await uiPrompt("Approve note (optional):", { title: "✅ Approve product", okText: "Approve" }); if (note == null) return; body = { note: note.trim() }; }
  try { await api(`/api/admin/moderation/products/${id}/${action}`, { method: "POST", body }); toast(`✅ ${action}d`); closeModal(); renderProducts(); } catch (e) { toast(e.message, "bad"); }
}

/* ============================================================ AUDIT LOG */
let LOG_SUB = "audit"; const AUDIT_CACHE = {};
async function renderAuditLog() {
  $("#view").innerHTML = `<div class="sub-tabs">
      <button class="sub-tab ${LOG_SUB === "audit" ? "active" : ""}" onclick="LOG_SUB='audit';renderAuditLog()">📋 Admin actions</button>
      <button class="sub-tab ${LOG_SUB === "purge" ? "active" : ""}" onclick="LOG_SUB='purge';renderAuditLog()">🗑 Data purge log</button>
    </div><div id="log-body"><div class="card"><span class="spin"></span> লোড হচ্ছে…</div></div>`;
  try { if (LOG_SUB === "audit") await renderAuditEntries(); else await renderPurgeLog(); }
  catch (e) { $("#log-body").innerHTML = errCard(e); }
}
async function renderAuditEntries() {
  const rows = await api("/api/admin/audit-log?limit=500");
  rows.forEach(r => AUDIT_CACHE[r.id] = r);
  const body = rows.map(r => `<tr onclick="auditDetail('${r.id}')" style="cursor:pointer">
    <td class="small muted">${esc((r.created_at || "").slice(0, 19))}</td>
    <td>${esc(r.actor_gmail || "—")}</td>
    <td><span class="pill">${esc(r.action || "—")}</span></td>
    <td class="small">${esc(r.target_type || "")}${r.target_id ? "/" + esc(String(r.target_id).slice(0, 12)) : ""}</td>
    <td title="${esc(r.reason || "")}">${esc((r.reason || "").slice(0, 120))}</td></tr>`).join("");
  $("#log-body").innerHTML = `<div class="card">
    <div class="row"><h3 style="margin:0">📋 Admin audit log</h3><span class="pill">${rows.length} entries</span>
      <input placeholder="🔍 filter (actor/action/target/reason)…" style="max-width:300px" oninput="filterTable('audittable',this.value)"><div class="grow"></div><button class="sm" onclick="renderAuditLog()">🔄</button></div>
    <div class="muted small" style="margin:6px 0">cockpit-এর প্রতিটা admin action এখানে append হয়। row-এ click → full JSON details।</div>
    <div class="tablewrap" style="margin-top:8px"><table id="audittable"><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Target</th><th>Reason</th></tr></thead>
    <tbody>${body || `<tr><td colspan="5" class="muted">এখনো কোনো admin action log হয়নি।</td></tr>`}</tbody></table></div></div>`;
}
function auditDetail(id) {
  const r = AUDIT_CACHE[id];
  modal(`<h3><span>📋 Audit entry · ${esc(r.action || "")}</span><button class="sm ghost" onclick="closeModal()">✕</button></h3>
    <div class="body"><div class="kv">
      <div class="k">When</div><div class="v">${esc((r.created_at || "").slice(0, 19))}</div>
      <div class="k">Actor</div><div class="v">${esc(r.actor_gmail || "—")}</div>
      <div class="k">Action</div><div class="v">${esc(r.action || "—")}</div>
      <div class="k">Target type</div><div class="v">${esc(r.target_type || "—")}</div>
      <div class="k">Target id</div><div class="v">${esc(r.target_id || "—")}</div>
      <div class="k">Reason</div><div class="v">${esc(r.reason || "—")}</div>
    </div>
    <div class="muted small" style="margin:12px 0 4px">Full details</div>
    <pre>${esc(JSON.stringify(r.details ?? {}, null, 2))}</pre></div>`);
}
async function renderPurgeLog() {
  const rows = await api("/api/admin/purge-log?limit=200");
  const body = rows.map(r => `<tr>
    <td class="small muted">${esc((r.created_at || "").slice(0, 19))}</td><td><span class="pill">${esc(r.kind || "—")}</span></td>
    <td>${esc(r.actor_gmail || "—")}</td><td>${esc(r.orders_deleted)}</td><td>${esc(r.order_messages_deleted)}</td>
    <td>${esc(r.conv_messages_deleted)}</td><td>${esc(r.rider_offers_deleted)}</td><td>${esc(r.admin_messages_deleted)}</td>
    <td>${esc(r.attachments_deleted)}</td><td title="${esc(r.notes || "")}">${esc((r.notes || "").slice(0, 80))}</td></tr>`).join("");
  $("#log-body").innerHTML = `<div class="card">
    <div class="row"><h3 style="margin:0">🗑 Data purge log</h3><span class="pill">${rows.length}</span>
      <span class="muted small">retention sweep + admin purge-এ যা মুছেছে তার record।</span><div class="grow"></div><button class="sm" onclick="renderAuditLog()">🔄</button></div>
    <div class="tablewrap" style="margin-top:10px"><table id="purgetable"><thead><tr><th>When</th><th>Kind</th><th>Actor</th><th>Orders</th><th>Ord msgs</th><th>Conv msgs</th><th>Offers</th><th>Admin msgs</th><th>Files</th><th>Notes</th></tr></thead>
    <tbody>${body || `<tr><td colspan="10" class="muted">কোনো purge record নেই।</td></tr>`}</tbody></table></div></div>`;
}
function filterTable(tableId, q) { q = q.toLowerCase(); document.querySelectorAll(`#${tableId} tbody tr`).forEach(tr => { tr.style.display = tr.textContent.toLowerCase().includes(q) ? "" : "none"; }); }

/* ============================================================ BOOT */
async function doLogin() {
  const btn = $("#lg-btn"); const err = $("#lg-err"); err.style.display = "none";
  STATE.pw = $("#lg-pw").value;
  if (!STATE.pw) { err.textContent = "Password দিন।"; err.style.display = "block"; return; }
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> logging in…';
  try {
    STATE.token = null; await login();
    if ($("#lg-remember").checked) sessionStorage.setItem("md_admin_pw", STATE.pw);
    $("#login").style.display = "none"; $("#app").style.display = "block";
    $("#who").textContent = location.host; renderTabs(); render();
  } catch (e) { err.textContent = e.message || String(e); err.style.display = "block"; }
  finally { btn.disabled = false; btn.textContent = "Login"; }
}
function logout() { sessionStorage.removeItem("md_admin_pw"); STATE.token = null; STATE.pw = ""; $("#app").style.display = "none"; $("#login").style.display = "flex"; $("#lg-pw").value = ""; }
(function boot() {
  const saved = sessionStorage.getItem("md_admin_pw");
  if (saved) { $("#lg-pw").value = saved; $("#lg-remember").checked = true; doLogin(); }
})();
</script>
